name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: plugin smoke test
        run: node --test test/smoke.mjs
      - name: panel history test
        run: node --test test/panel-history.mjs
      - name: ui host syntax check
        run: node --check ui/index.js
